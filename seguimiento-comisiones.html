<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seguimiento Integral de Comisiones — Emmanuel Ferrario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --paper:#F7F4EC;
    --paper-dim:#EFEAE0;
    --ink:#201E1A;
    --ink-soft:#5B564C;
    --navy:#1E3A5F;
    --navy-deep:#142940;
    --olive:#6B7A4F;
    --ochre:#C08A2E;
    --brick:#9C4A3C;
    --violet:#6E5A87;
    --line:#D9D2C2;
    --card:#FFFEFA;
    --shadow: 0 1px 2px rgba(32,30,26,0.06), 0 4px 14px rgba(32,30,26,0.07);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    background-image:
      radial-gradient(circle at 100% 0%, rgba(30,58,95,0.04) 0%, transparent 45%),
      radial-gradient(circle at 0% 100%, rgba(192,138,46,0.05) 0%, transparent 45%);
  }
  ::selection{ background:var(--ochre); color:#fff; }
  a{color:var(--navy);}
  .serif{ font-family:'Source Serif 4', serif; }
  .mono{ font-family:'JetBrains Mono', monospace; }

  /* ---------- Header ---------- */
  header.top{
    position:sticky; top:0; z-index:40;
    background:rgba(247,244,236,0.92);
    backdrop-filter: blur(8px);
    border-bottom:1px solid var(--line);
  }
  .top-inner{
    max-width:1400px; margin:0 auto; padding:18px 28px;
    display:flex; align-items:center; justify-content:space-between; gap:20px;
    flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:baseline; gap:12px; }
  .brand .stamp{
    font-family:'JetBrains Mono', monospace;
    font-size:11px; letter-spacing:0.12em;
    color:var(--navy); border:1px solid var(--navy);
    padding:3px 8px; border-radius:3px; text-transform:uppercase;
  }
  .brand h1{
    font-family:'Source Serif 4', serif;
    font-size:21px; font-weight:700; margin:0; letter-spacing:-0.01em;
  }
  .top-meta{ display:flex; align-items:center; gap:16px; font-size:12.5px; color:var(--ink-soft); }
  .sync-dot{
    width:7px; height:7px; border-radius:50%; background:var(--olive);
    display:inline-block; margin-right:6px;
    box-shadow:0 0 0 0 rgba(107,122,79,0.5); animation: pulse 2.4s infinite;
  }
  .sync-dot.error{ background:var(--brick); animation:none; }
  .sync-dot.loading{ background:var(--ochre); }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(107,122,79,0.4); }
    70%{ box-shadow:0 0 0 6px rgba(107,122,79,0); }
    100%{ box-shadow:0 0 0 0 rgba(107,122,79,0); }
  }
  button.refresh{
    background:var(--navy); color:#fff; border:none;
    font-family:'Inter',sans-serif; font-weight:600; font-size:12.5px;
    padding:8px 14px; border-radius:6px; cursor:pointer;
    display:flex; align-items:center; gap:6px; transition:background 0.15s ease;
  }
  button.refresh:hover{ background:var(--navy-deep); }
  button.refresh svg{ width:13px; height:13px; }
  button.refresh.spinning svg{ animation: spin 0.9s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  main{ max-width:1400px; margin:0 auto; padding:28px; }

  .section-label{ display:flex; align-items:center; gap:10px; margin:0 0 16px 0; }
  .section-label .num{
    font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-soft);
    border:1px solid var(--line); background:var(--paper-dim);
    padding:2px 7px; border-radius:3px;
  }
  .section-label h2{ font-family:'Source Serif 4', serif; font-size:19px; margin:0; font-weight:600; }
  .section-label .rule{ flex:1; height:1px; background:var(--line); }

  /* ---------- Barra de exportación ---------- */
  .export-bar{
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    margin-top:18px; padding:14px 16px;
    background:var(--card); border:1px solid var(--line); border-radius:8px;
  }
  .export-checkbox{ display:flex; align-items:center; gap:7px; font-size:13px; color:var(--ink-soft); cursor:pointer; user-select:none; }
  .export-checkbox input{ width:15px; height:15px; cursor:pointer; accent-color:var(--navy); }
  .export-btn{
    font-family:'Inter',sans-serif; font-weight:600; font-size:13px;
    padding:8px 16px; border-radius:6px; cursor:pointer;
    border:1px solid var(--line); background:#fff; color:var(--ink);
    display:flex; align-items:center; gap:7px; transition:all 0.15s ease;
  }
  .export-btn:hover{ border-color:var(--navy); color:var(--navy); }
  .export-btn svg{ width:14px; height:14px; }
  .export-btn.excel:hover{ border-color:var(--olive); color:var(--olive); }
  .export-btn.pdf:hover{ border-color:var(--brick); color:var(--brick); }

  #print-area{ display:none; }
  @media print{
    body *{ visibility:hidden; }
    #print-area, #print-area *{ visibility:visible; }
    #print-area{ display:block; position:absolute; top:0; left:0; width:100%; padding:20px; background:#fff; }
    #print-area h1{ font-family:'Source Serif 4', serif; font-size:20px; margin-bottom:4px; }
    #print-area .print-meta{ font-size:11px; color:#555; margin-bottom:16px; }
    #print-area table{ width:100%; border-collapse:collapse; font-size:10.5px; }
    #print-area th, #print-area td{ border:1px solid #ccc; padding:5px 7px; text-align:left; }
    #print-area th{ background:#1E3A5F; color:#fff; }
  }

  /* ---------- Overview stats ---------- */
  .overview{ display:grid; grid-template-columns: repeat(3, 1fr) 1.6fr; gap:14px; margin-bottom:36px; }
  @media (max-width:1100px){ .overview{ grid-template-columns: repeat(2,1fr); } }
  @media (max-width:640px){ .overview{ grid-template-columns: 1fr; } }
  .stat-card{ background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px 18px; box-shadow:var(--shadow); animation: fadeInUp .35s ease both; }
  .stat-card .label{ font-size:11.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); font-weight:600; margin-bottom:8px; }
  .stat-card .value{ font-family:'Source Serif 4', serif; font-size:32px; font-weight:700; line-height:1; color:var(--navy); }
  .stat-card .sub{ font-size:12px; color:var(--ink-soft); margin-top:4px; }

  /* ---------- Filters ---------- */
  .filters{
    background:var(--card); border:1px solid var(--line); border-radius:8px;
    padding:16px 18px; margin-bottom:28px;
    display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:14px 16px; align-items:end; box-shadow:var(--shadow);
  }
  .filter-group{ display:flex; flex-direction:column; gap:6px; min-width:0; }
  .filter-group label{ font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); font-weight:600; }
  select, input[type="text"], input[type="date"]{
    font-family:'Inter',sans-serif; font-size:13.5px; padding:8px 10px; border-radius:6px;
    border:1px solid var(--line); background:#fff; color:var(--ink);
  }
  select:focus, input:focus{ outline:2px solid var(--navy); outline-offset:1px; }
  .filter-pills{ display:flex; gap:6px; flex-wrap:wrap; }
  .pill{
    font-size:12px; padding:6px 11px; border-radius:20px;
    border:1px solid var(--line); background:#fff; cursor:pointer;
    transition:all 0.12s ease; font-weight:500; user-select:none;
  }
  .pill:hover{ border-color:var(--navy); }
  .pill.active{ background:var(--navy); color:#fff; border-color:var(--navy); }
  .clear-filters{ font-size:12px; color:var(--brick); cursor:pointer; font-weight:600; background:none; border:none; padding:8px 4px; text-decoration:underline; }
  .date-range{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .date-range span{ font-size:11.5px; color:var(--ink-soft); flex-shrink:0; }
  .date-range input[type="date"]{ flex:1 1 130px; min-width:0; }

  /* ---------- Desplegable multi-selección (filtro de Comisión) ---------- */
  .multiselect{ position:relative; }
  .multiselect-toggle{
    width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px;
    font-family:'Inter',sans-serif; font-size:13.5px; padding:8px 10px; border-radius:6px;
    border:1px solid var(--line); background:#fff; color:var(--ink); cursor:pointer; text-align:left;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .multiselect-toggle:hover{ border-color:var(--navy); }
  .multiselect-toggle span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .multiselect.open .multiselect-toggle{ outline:2px solid var(--navy); outline-offset:1px; }
  .multiselect-toggle .chevron{ width:14px; height:14px; flex-shrink:0; transition:transform 0.15s ease; color:var(--ink-soft); }
  .multiselect.open .multiselect-toggle .chevron{ transform:rotate(180deg); }
  .multiselect-menu{
    display:none; position:absolute; top:calc(100% + 6px); left:0; min-width:100%; width:max-content; max-width:340px;
    max-height:280px; overflow-y:auto; background:#fff; border:1px solid var(--line); border-radius:8px;
    box-shadow:0 6px 20px rgba(32,30,26,0.16); z-index:30; padding:6px;
  }
  .multiselect.open .multiselect-menu{ display:block; }
  .multiselect-option{
    display:flex; align-items:center; gap:9px; font-size:13px; padding:7px 8px;
    border-radius:5px; cursor:pointer; color:var(--ink);
  }
  .multiselect-option:hover{ background:var(--paper-dim); }
  .multiselect-option input{ width:14px; height:14px; accent-color:var(--navy); cursor:pointer; flex-shrink:0; }

  /* ---------- Kanban ---------- */
  .kanban-wrap{ margin-bottom:40px; }
  .kanban{ display:grid; grid-template-columns: repeat(5, minmax(220px,1fr)); gap:14px; overflow-x:auto; }
  @media (max-width:1100px){ .kanban{ grid-template-columns: repeat(3, minmax(220px,1fr)); } }
  @media (max-width:700px){ .kanban{ grid-template-columns:1fr; } }

  .kcol{
    background:var(--paper-dim); border-radius:10px; border:1px solid var(--line);
    display:flex; flex-direction:column; min-height:200px; max-height:640px;
    animation: colIn .3s ease both;
  }
  .kcol-head{ padding:13px 14px 11px; border-bottom:2px solid var(--kcolor, var(--navy)); display:flex; align-items:center; justify-content:space-between; }
  .kcol-head .title{ font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:0.04em; color: var(--kcolor, var(--navy)); }
  .kcol-head .count{ font-family:'JetBrains Mono',monospace; font-size:11px; background:#fff; border:1px solid var(--line); padding:1px 7px; border-radius:10px; color:var(--ink-soft); }
  .kcol-body{ padding:10px; display:flex; flex-direction:column; gap:9px; overflow-y:auto; flex:1; }

  .kcard{
    background:var(--card); border:1px solid var(--line); border-left:3px solid var(--kcolor, var(--navy));
    border-radius:6px; padding:11px 12px; box-shadow:var(--shadow); cursor:default;
    transition: transform 0.12s ease, box-shadow 0.12s ease; animation: cardIn .3s ease both;
  }
  .kcard:hover{ transform:translateY(-1px); box-shadow:0 2px 4px rgba(32,30,26,0.08), 0 8px 18px rgba(32,30,26,0.09); }
  .kcard .exp{ font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--ochre); font-weight:600; margin-bottom:4px; display:block; }
  .kcard .title{
    font-size:12.5px; line-height:1.35; font-weight:600; color:var(--ink); margin-bottom:6px;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
  }
  .kcard .meta{ display:flex; flex-wrap:wrap; gap:5px; align-items:center; }
  .kcard .tag{ font-size:10px; padding:2px 6px; border-radius:4px; background:var(--paper-dim); color:var(--ink-soft); font-weight:600; text-transform:uppercase; letter-spacing:0.03em; }
  .kcard .tag.com-tag{ background:var(--navy); color:#fff; }
  .kcard .tag.despacho-tag{ background:transparent; border:1px solid var(--violet); color:var(--violet); }
  .kcard .tag.sancion-tag{ background:transparent; border:1px solid var(--olive); color:var(--olive); }

  /* ---------- Modal de detalle (Resumen del expediente) ---------- */
  .modal-overlay{
    display:none; position:fixed; inset:0; z-index:90; background:rgba(20,18,14,0.5);
    align-items:center; justify-content:center; padding:24px;
  }
  .modal-overlay.show{ display:flex; animation: fadeInUp 0.18s ease both; }
  .modal-panel{
    position:relative; background:var(--card); border-radius:12px; border:1px solid var(--line);
    max-width:620px; width:100%; max-height:85vh; overflow-y:auto; padding:26px 28px;
    box-shadow:0 20px 60px rgba(0,0,0,0.3);
  }
  .modal-close{
    position:absolute; top:14px; right:16px; background:none; border:none; font-size:26px; line-height:1;
    color:var(--ink-soft); cursor:pointer; padding:4px 8px; border-radius:6px;
  }
  .modal-close:hover{ background:var(--paper-dim); color:var(--ink); }
  .modal-header{ display:flex; align-items:center; gap:10px; margin-bottom:10px; padding-right:26px; }
  .modal-exp{ font-family:'JetBrains Mono',monospace; font-size:12.5px; font-weight:600; color:var(--ochre); }
  .modal-sumario{ font-family:'Source Serif 4', serif; font-size:19px; font-weight:700; margin:0 0 12px 0; line-height:1.35; padding-right:26px; }
  .modal-tags{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:20px; }
  .modal-section{ margin-bottom:20px; }
  .modal-label{ font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); font-weight:700; margin-bottom:5px; }
  .modal-text{ font-size:14px; line-height:1.55; color:var(--ink); }
  .modal-empty{ color:var(--ink-soft); font-style:italic; font-size:13px; }
  .modal-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:14px 20px; margin-bottom:6px; }
  @media (max-width:520px){ .modal-grid{ grid-template-columns:1fr; } }

  /* ---------- Table view ---------- */
  .table-wrap{ background:var(--card); border:1px solid var(--line); border-radius:8px; overflow:hidden; box-shadow:var(--shadow); margin-bottom:40px; }
  .table-scroll{ overflow-x:auto; max-height:640px; }
  table{ width:100%; border-collapse:collapse; font-size:12.8px; }
  thead th{
    position:sticky; top:0; z-index:5; background:var(--navy); color:#fff; text-align:left; padding:10px 12px;
    font-weight:600; white-space:nowrap; font-size:11.5px; text-transform:uppercase; letter-spacing:0.03em;
  }
  tbody tr{ border-bottom:1px solid var(--line); }
  tbody tr.clickable-row{ cursor:pointer; }
  tbody tr:hover{ background:var(--paper-dim); }
  tbody td{ padding:9px 12px; vertical-align:top; color:var(--ink); }
  td.proyecto-cell{ min-width:260px; font-weight:600; }
  .status-chip{ display:inline-block; font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:20px; text-transform:uppercase; letter-spacing:0.03em; white-space:nowrap; }

  /* ---------- States ---------- */
  .state-ingresado{ --kcolor:#9C8B5E; }
  .state-asesores{ --kcolor:var(--navy); }
  .state-diputados{ --kcolor:var(--ochre); }
  .state-despacho{ --kcolor:var(--violet); }
  .state-sancionado{ --kcolor:var(--olive); }

  .status-chip.state-ingresado{ background:#F1ECDB; color:#7A6B3D; }
  .status-chip.state-asesores{ background:#E4EAF1; color:var(--navy-deep); }
  .status-chip.state-diputados{ background:#F8EAD2; color:#8A5E18; }
  .status-chip.state-despacho{ background:#EEE8F2; color:#4A3B5E; }
  .status-chip.state-sancionado{ background:#E7ECDE; color:#4F5C38; }

  /* ---------- Loading / empty ---------- */
  .loading-screen{ display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:60vh; gap:14px; color:var(--ink-soft); }
  .loading-screen .spinner{ width:34px; height:34px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--navy); animation:spin 0.8s linear infinite; }
  .error-banner{ background:#F8E9E6; border:1px solid var(--brick); color:#7A352A; padding:14px 18px; border-radius:8px; margin-bottom:20px; font-size:13.5px; display:flex; gap:10px; align-items:flex-start; }
  .error-banner b{ font-weight:700; }
  .empty-state{ text-align:center; padding:30px 10px; color:var(--ink-soft); font-size:13px; }

  footer{ text-align:center; padding:30px; color:var(--ink-soft); font-size:11.5px; border-top:1px solid var(--line); margin-top:20px; }

  .toast{
    position:fixed; bottom:24px; right:24px; z-index:100; background:var(--navy-deep); color:#fff;
    padding:12px 18px; border-radius:8px; font-size:13px; box-shadow:0 6px 20px rgba(0,0,0,0.25);
    display:flex; align-items:center; gap:10px; transform:translateY(20px); opacity:0; transition:all 0.25s ease; pointer-events:none;
  }
  .toast.show{ transform:translateY(0); opacity:1; }
  .toast.error{ background:var(--brick); }

  /* ---------- Gráficos (donut + barras + ranking) ---------- */
  .viz-grid{ display:grid; grid-template-columns: repeat(2, 1fr); gap:14px; margin-bottom:36px; }
  @media (max-width:800px){ .viz-grid{ grid-template-columns:1fr; } }
  .viz-card-wide{ grid-column: 1 / -1; }
  .viz-card{ background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px 18px; box-shadow:var(--shadow); animation: fadeInUp .35s ease both; }
  .viz-card-title{ font-size:11.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); font-weight:600; margin-bottom:12px; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .viz-hint{ font-size:10.5px; text-transform:none; letter-spacing:0; font-weight:400; color:var(--ink-soft); opacity:0.65; }
  .viz-card-body{ display:flex; align-items:center; min-height:170px; }

  .donut-wrap{ display:flex; align-items:center; gap:22px; flex-wrap:wrap; width:100%; }
  .donut-ring{ width:150px; height:150px; border-radius:50%; flex-shrink:0; position:relative; transition: background 0.3s ease; }
  .donut-ring::after{ content:""; position:absolute; inset:20px; border-radius:50%; background:var(--card); }
  .donut-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .donut-total{ font-family:'Source Serif 4', serif; font-size:27px; font-weight:700; color:var(--ink); line-height:1; }
  .donut-total-label{ font-family:'JetBrains Mono', monospace; font-size:8.5px; letter-spacing:0.08em; color:var(--ink-soft); margin-top:3px; }
  .donut-legend{ display:flex; flex-direction:column; gap:4px; flex:1; min-width:160px; }
  .legend-row{
    display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ink); font-family:'Inter',sans-serif;
    background:none; border:1px solid transparent; border-radius:6px; padding:6px 8px; margin:0; cursor:pointer; width:100%; text-align:left;
    transition: background 0.12s ease, border-color 0.12s ease;
  }
  .legend-row:hover{ background:var(--paper-dim); }
  .legend-row.active{ background:var(--paper-dim); border-color:var(--line); font-weight:600; }
  .legend-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .legend-label{ flex:1; }
  .legend-value{ font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--ink-soft); }

  .bar-chart{ display:flex; align-items:flex-end; gap:8px; width:100%; height:170px; padding-top:6px; }
  .bar-col{ flex:1; min-width:0; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:6px; background:none; border:none; cursor:pointer; padding:0; font-family:'Inter',sans-serif; }
  .bar-val{ font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--ink-soft); }
  .bar-fill-wrap{ width:100%; max-width:44px; flex:1; display:flex; align-items:flex-end; }
  .bar-fill{ width:100%; min-height:3px; border-radius:4px 4px 0 0; background:var(--navy); transform-origin:bottom; animation: barGrow .5s ease both; transition: background 0.15s ease; }
  .bar-col:hover .bar-fill{ background:var(--navy-deep); }
  .bar-col.active .bar-fill{ background:var(--ochre); }
  .bar-lbl{ font-size:10.5px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .bar-col.active .bar-lbl{ color:var(--ink); font-weight:600; }
  @keyframes barGrow{ from{ transform:scaleY(0); } to{ transform:scaleY(1); } }

  .hbar-list{ display:flex; flex-direction:column; gap:4px; width:100%; }
  .hbar-row{
    display:flex; align-items:center; gap:12px; width:100%; background:none; border:1px solid transparent; border-radius:6px;
    padding:7px 8px; cursor:pointer; text-align:left; font-family:'Inter',sans-serif; transition: background 0.12s ease, border-color 0.12s ease;
  }
  .hbar-row:hover{ background:var(--paper-dim); }
  .hbar-row.active{ background:var(--paper-dim); border-color:var(--line); }
  .hbar-label{ width:150px; flex-shrink:0; font-size:12.5px; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hbar-row.active .hbar-label{ font-weight:700; color:var(--navy); }
  .hbar-track{ flex:1; background:var(--paper-dim); border-radius:5px; height:12px; overflow:hidden; }
  .hbar-fill{ height:100%; background:var(--navy); border-radius:5px; transform-origin:left; animation: hbarGrow .5s ease both; transition: background 0.15s ease; }
  .hbar-row:hover .hbar-fill{ background:var(--navy-deep); }
  .hbar-row.active .hbar-fill{ background:var(--ochre); }
  .hbar-value{ font-family:'JetBrains Mono', monospace; font-size:11.5px; color:var(--ink-soft); width:26px; text-align:right; flex-shrink:0; }
  @keyframes hbarGrow{ from{ transform:scaleX(0); } to{ transform:scaleX(1); } }

  @keyframes cardIn{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }
  @keyframes colIn{ from{ opacity:0; transform:translateY(4px); } to{ opacity:1; transform:translateY(0); } }
  @keyframes fadeInUp{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <span class="stamp">Mesa de Entradas</span>
      <h1>Seguimiento Integral de Comisiones</h1>
    </div>
    <div class="top-meta">
      <span id="sync-status"><span class="sync-dot loading" id="sync-dot"></span><span id="sync-text">Conectando…</span></span>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
        Actualizar
      </button>
    </div>
  </div>
</header>

<main>
  <div id="loading-screen" class="loading-screen">
    <div class="spinner"></div>
    <div>Cargando datos desde la planilla…</div>
  </div>

  <div id="app-content" style="display:none;">

    <div id="error-zone"></div>

    <div class="section-label">
      <span class="num">01</span>
      <h2>Panorama general</h2>
      <span class="rule"></span>
    </div>
    <div class="overview" id="overview-stats"></div>

    <div class="section-label">
      <span class="num">02</span>
      <h2>Filtros</h2>
      <span class="rule"></span>
    </div>
    <div class="filters" id="filters-zone"></div>

    <div class="section-label">
      <span class="num">03</span>
      <h2>Seguimiento por etapa</h2>
      <span class="rule"></span>
    </div>
    <div class="kanban-wrap">
      <div class="kanban" id="kanban-board"></div>
    </div>

    <div class="section-label">
      <span class="num">04</span>
      <h2>Gráficos</h2>
      <span class="rule"></span>
    </div>
    <div class="viz-grid" id="charts-zone"></div>

    <div class="section-label">
      <span class="num">05</span>
      <h2>Detalle completo</h2>
      <span class="rule"></span>
    </div>
    <div class="table-wrap">
      <div class="table-scroll">
        <table id="data-table">
          <thead id="table-head"></thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </div>

    <div class="export-bar" id="export-bar"></div>

  </div>
</main>

<footer>
  Datos en vivo desde Google Sheets · Última actualización: <span id="footer-time">—</span>
</footer>

<div class="toast" id="toast"></div>
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-panel" id="modal-panel"></div>
</div>
<div id="print-area"></div>

<script src="comisiones.js"></script>
</body>
</html>
